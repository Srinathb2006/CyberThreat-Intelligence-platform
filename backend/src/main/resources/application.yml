spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./backend/.env[.properties]"
  application:
    name: cyberintel
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyberintel}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${MAX_APK_SIZE:50MB}
      max-request-size: ${MAX_APK_SIZE:50MB}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:7070}
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload-directory: ${UPLOAD_DIRECTORY:./analysis/uploads}
  max-apk-size: ${MAX_APK_SIZE:50MB}
  tools:
    jadx:
      enabled: ${JADX_ENABLED:false}
      path: ${JADX_PATH:}
    apktool:
      enabled: ${APKTOOL_ENABLED:false}
      path: ${APKTOOL_PATH:}
    androguard:
      enabled: ${ANDROGUARD_ENABLED:false}
      path: ${ANDROGUARD_PATH:}
    yara:
      enabled: ${YARA_ENABLED:false}
      path: ${YARA_PATH:}
    aapt:
      enabled: ${AAPT_ENABLED:false}
      path: ${AAPT_PATH:}
analysis:
  directory: ${ANALYSIS_DIRECTORY:./analysis}
  timeout-seconds: ${ANALYSIS_TIMEOUT_SECONDS:120}
  retention-days: ${ANALYSIS_RETENTION_DAYS:7}
  max-expanded-bytes: ${MAX_APK_EXPANDED_BYTES:268435456}
  max-entries: ${MAX_APK_ENTRIES:20000}
  max-output-bytes: ${MAX_ANALYSIS_OUTPUT_BYTES:536870912}
